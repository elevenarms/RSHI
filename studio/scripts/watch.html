<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>3D episode view</title>
<style>
  html, body { margin: 0; height: 100%; background: radial-gradient(circle at 50% 45%, #10213a, #03060c 70%); color: #8fb4e8; font-family: ui-monospace, Menlo, monospace; overflow: hidden; }
  .wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; }
  svg { width: min(70vw, 64vh); height: auto; }
  .lbl { letter-spacing: .3em; font-size: 13px; text-transform: uppercase; opacity: .7; }
  .plate { animation: drop 3.2s ease-in-out infinite; }
  @keyframes drop { 0% { transform: translateY(-120px); opacity: 0 } 25% { opacity: 1 } 45%,100% { transform: translateY(0); opacity: 1 } }
  .jet { animation: jet 0.9s linear infinite; }
  @keyframes jet { from { stroke-dashoffset: 20 } to { stroke-dashoffset: 0 } }
  .arm { transform-origin: 200px 238px; animation: spin 2s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg) } }
</style>
</head>
<body>
<div class="wrap">
  <svg viewBox="0 0 400 330">
    <defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#2de2ff" stop-opacity=".25"/><stop offset="1" stop-color="#2de2ff" stop-opacity="0"/></linearGradient></defs>
    <rect x="70" y="20" width="260" height="290" rx="14" fill="url(#g)" stroke="#2de2ff" stroke-opacity=".6" stroke-width="2"/>
    <line x1="90" y1="120" x2="310" y2="120" stroke="#6d8bff" stroke-width="3"/>
    <line x1="90" y1="225" x2="310" y2="225" stroke="#6d8bff" stroke-width="3"/>
    <g id="upper"></g><g id="lower"></g>
    <g class="arm"><line x1="140" y1="238" x2="260" y2="238" stroke="#c6f24e" stroke-width="4" stroke-linecap="round"/></g>
    <g stroke="#2de2ff" stroke-width="2" stroke-dasharray="4 6" opacity=".7">
      <path class="jet" d="M150 232 L130 140"/><path class="jet" d="M200 232 L200 140"/><path class="jet" d="M250 232 L270 140"/>
    </g>
  </svg>
  <div class="lbl">3D episode view · <span id="sid"></span></div>
</div>
<div class="tt" id="tt"><svg viewBox="-60 -60 120 120"><g class="spin"><ellipse cx="0" cy="8" rx="44" ry="14" fill="#e9e9e9" stroke="#111" stroke-width="2"/><path d="M-36 0 Q0 46 36 0 Z" fill="#fff" stroke="#111" stroke-width="2.5"/><ellipse cx="0" cy="0" rx="36" ry="10" fill="#f6f6f6" stroke="#111" stroke-width="2"/><ellipse cx="-8" cy="1" rx="14" ry="4" fill="#c8a24a" opacity=".85"/></g></svg><div class="tt-l" id="ttl"></div></div>
<style>
  .tt { display: none; position: absolute; inset: 0; background: #fff; color: #111; align-items: center; justify-content: center; flex-direction: column; font-family: ui-monospace, Menlo, monospace; }
  .tt svg { width: 70vmin; height: 70vmin; }
  .spin { animation: wob 4s ease-in-out infinite; transform-origin: 0 0; }
  @keyframes wob { 0% { transform: scaleX(1) } 50% { transform: scaleX(-1) } 100% { transform: scaleX(1) } }
  .tt-l { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
  body.turn { background: #fff; } body.turn .wrap { display: none; } body.turn .tt { display: flex; }
</style>
<script>
  function hashUpdate() {
    const h = location.hash.slice(1).split('&');
    const turn = h.includes('turntable');
    document.body.classList.toggle('turn', turn);
    const it = h.find((x) => x.startsWith('item='));
    document.getElementById('ttl').textContent = it ? decodeURIComponent(it.slice(5)) : '';
  }
  addEventListener('hashchange', hashUpdate); hashUpdate();
  document.getElementById('sid').textContent = (location.hash.slice(1).split('&')[0] || 'session');
  const up = document.getElementById('upper'), lo = document.getElementById('lower');
  for (let i = 0; i < 7; i++) up.insertAdjacentHTML('beforeend', `<path class="plate" style="animation-delay:${i * 0.35}s" d="M${104 + i * 30} 115 q12 -26 24 0" fill="none" stroke="#ffb43d" stroke-width="3"/>`);
  for (let i = 0; i < 9; i++) lo.insertAdjacentHTML('beforeend', `<rect class="plate" style="animation-delay:${0.2 + i * 0.3}s" x="${100 + i * 23}" y="160" width="6" height="62" rx="3" fill="#e8f0ff" opacity=".85"/>`);
</script>
</body>
</html>
