<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spotless Crew Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter+Tight:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="top">
        <div class="brand">
          <div class="logo">C</div>
          <div>
            <div class="title">CREW</div>
            <div class="sub">a self-improving agent team</div>
          </div>
        </div>
        <div id="run" class="run"></div>
        <div id="inference" class="inference"></div>
        <div id="counters" class="counters"></div>
      </header>
      <nav id="phases"></nav>
      <main>
        <section id="team" class="panel">
          <h2>Team <em>who is working</em></h2>
          <svg id="graph" viewBox="0 0 500 470"></svg>
        </section>
        <section id="chatter" class="panel">
          <h2>Team chatter</h2>
          <div id="feed" class="feed"></div>
        </section>
        <section id="live" class="panel">
          <h2>Live <em>the game, as the loader plays it</em></h2>
          <div id="stage"></div>
        </section>
        <section id="tokens" class="panel term">
          <h2>Token stream <em>live from Crusoe Managed Inference</em></h2>
          <div id="meter" class="meter"></div>
          <div id="waterfall" class="waterfall"></div>
        </section>
        <section id="evo" class="panel">
          <h2>Evolution <em>score per generation · same validation tasks</em></h2>
          <svg id="chart" viewBox="0 0 520 300"></svg>
          <div id="lineage"></div>
        </section>
        <section id="memory" class="panel">
          <h2>Memory <em>librarian</em></h2>
          <div id="mem"></div>
        </section>
      </main>
      <footer id="console"></footer>
    </div>
    <div id="exam" class="exam hidden"></div>
    <div id="diff" class="diff hidden"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
